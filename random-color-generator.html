<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
            background: #3498db;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        #generateBtn {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }
        
        #generateBtn:hover {
            background: #34495e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        #generateBtn:active {
            transform: translateY(0);
        }
        
        .color-info {
            background: #ecf0f1;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        
        .color-code {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin: 8px 0;
            font-family: 'Courier New', monospace;
        }
        
        .color-label {
            font-size: 12px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .copy-btn, .gradient-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .copy-btn:hover, .gradient-btn:hover {
            background: #2980b9;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Random Color Generator</h1>
        
        <button id="generateBtn">Generate Color</button>
        
        <div class="color-info">
            <div class="color-label">HEX Code</div>
            <div class="color-code" id="hexCode">#3498DB</div>
            
            <div class="color-label">RGB Code</div>
            <div class="color-code" id="rgbCode">rgb(52, 152, 219)</div>
        </div>
        
        <div class="button-group">
            <button class="copy-btn" id="copyBtn">Copy HEX</button>
            <button class="gradient-btn" id="gradientBtn">Gradient Mode</button>
        </div>
    </div>
    
    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const gradientBtn = document.getElementById('gradientBtn');
        const hexCodeEl = document.getElementById('hexCode');
        const rgbCodeEl = document.getElementById('rgbCode');
        const body = document.body;
        const toast = document.getElementById('toast');
        
        let isGradientMode = false;
        
        // Generate random hex color
        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }
        
        // Convert HEX to RGB
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${r}, ${g}, ${b})`;
        }
        
        // Apply color to background
        function applyColor() {
            if (isGradientMode) {
                const color1 = getRandomColor();
                const color2 = getRandomColor();
                body.style.background = `linear-gradient(135deg, ${color1}, ${color2})`;
                hexCodeEl.textContent = `${color1} → ${color2}`;
                rgbCodeEl.textContent = `${hexToRgb(color1)} → ${hexToRgb(color2)}`;
            } else {
                const newColor = getRandomColor();
                body.style.background = newColor;
                hexCodeEl.textContent = newColor;
                rgbCodeEl.textContent = hexToRgb(newColor);
            }
        }
        
        // Show toast notification
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
        
        // Event: Button click to generate color
        generateBtn.addEventListener('click', applyColor);
        
        // Extra Feature 1: Copy color code
        copyBtn.addEventListener('click', () => {
            const hexText = hexCodeEl.textContent;
            navigator.clipboard.writeText(hexText).then(() => {
                showToast('Color code copied!');
            });
        });
        
        // Extra Feature 2: Gradient generation
        gradientBtn.addEventListener('click', () => {
            isGradientMode = !isGradientMode;
            gradientBtn.textContent = isGradientMode ? 'Solid Mode' : 'Gradient Mode';
            applyColor();
        });
        
        // Generate initial color on load
        applyColor();
    </script>
</body>
</html>
